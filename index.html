<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="Descubra joias em Prata 925 na TL Atelier: colares, pulseiras, brincos, conjuntos e anéis para presentear ou destacar sua identidade."
    />

    <title>
      TL Atelier - Joias em Prata 925
    </title>

    <!-- Preload do banner exibido em celulares -->
    <link
      rel="preload"
      as="image"
      href="/banner-tl-mobile.webp"
      type="image/webp"
      media="(max-width: 767px)"
      fetchpriority="high"
    />

    <!-- Preload do banner exibido em computadores -->
    <link
      rel="preload"
      as="image"
      href="/banner-tl-desktop.webp"
      type="image/webp"
      media="(min-width: 768px)"
      fetchpriority="high"
    />

    <!-- Antecipação da conexão com o Google Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- Carrega as fontes sem bloquear a renderização inicial -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap"
    />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />

    <!-- Fallback para navegadores sem JavaScript -->
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap"
      />
    </noscript>

    <link
      id="canonical-url"
      rel="canonical"
      href="https://www.tlatelier.com.br/"
    />

    <link
      rel="icon"
      type="image/png"
      href="/favicon-tl-atelier.png"
    />

    <link
      rel="apple-touch-icon"
      href="/favicon-tl-atelier.png"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
