<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Carregamento prioritário do banner mobile -->
    <link
      rel="preload"
      as="image"
      href="/banner-tl-mobile.webp"
      type="image/webp"
      media="(max-width: 767px)"
      fetchpriority="high"
    />

    <!-- Carregamento prioritário do banner desktop -->
    <link
      rel="preload"
      as="image"
      href="/banner-tl-desktop.webp"
      type="image/webp"
      media="(min-width: 768px)"
      fetchpriority="high"
    />

    <!-- Conexão antecipada com o Google Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />

    <!-- Fontes da identidade visual -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap"
    />

    <meta
      name="description"
      content="Descubra joias em Prata 925 na TL Atelier: colares, pulseiras, brincos, conjuntos e anéis para presentear ou destacar sua identidade."
    />

    <link
      id="canonical-url"
      rel="canonical"
      href="https://www.tlatelier.com.br/"
    />

    <link
      rel="icon"
      type="image/png"
      href="/favicon-tl-atelier.png"
    />

    <link
      rel="apple-touch-icon"
      href="/favicon-tl-atelier.png"
    />

    <title>
      TL Atelier | Joias em Prata 925 para Todos os Momentos
    </title>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
